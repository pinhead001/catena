[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catena-ai"
dynamic = ["version"]
description = "Lightweight AI agent orchestration - chain LLM calls with retries, caching, and cost tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Catena Contributors" }
]
keywords = ["ai", "llm", "agents", "orchestration", "chains", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
structured = ["pydantic>=2.0.0"]
all = ["openai>=1.0.0", "anthropic>=0.18.0", "pydantic>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/pinhead001/catena"
Repository = "https://github.com/pinhead001/catena"
Issues = "https://github.com/pinhead001/catena/issues"

[tool.hatch.version]
path = "src/catena/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/catena"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
